spring.application.name=bakery-backend
server.port=8080

# MySQL Database configuration (Real World)
# Make sure XAMPP/WAMP is running and a database named 'bakerydb' exists
spring.datasource.url=jdbc:mysql://localhost:3306/bakerydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (automatically creates/updates tables based on our model)
spring.jpa.hibernate.ddl-auto=update
